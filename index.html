<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Registro de Horas | Hub Tech Chiapas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Face API JS para Reconocimiento Facial -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- Scripts locales -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-md w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-indigo-400">HUB TECH CHIAPAS</h1>
            <p class="text-slate-400 text-sm">Registro de Asistencia con Verificación Rostro y GPS</p>
        </div>

        <!-- Tarjeta de Registro de Entrada / Salida -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-xl font-semibold text-emerald-400 flex items-center justify-center gap-2">
                ⏱️ Registrar Mi Entrada / Salida
            </h2>

            <!-- Visor de la Cámara -->
            <div class="relative w-full aspect-video bg-slate-900 rounded-xl overflow-hidden border border-slate-700 flex items-center justify-center">
                <video id="camara-preview" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <canvas id="foto-canvas" class="hidden"></canvas>
                <div id="camara-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 text-xs p-4 text-center">
                    <span>📷 Carga de cámara y modelos IA en proceso...</span>
                </div>
            </div>

            <form id="form-asistencia" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ingresa tu Matrícula</label>
                    <input type="text" id="asistencia-matricula" required placeholder="Ej. 2023001" 
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-700 border border-slate-600 text-white font-mono text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tu Hora de Entrada / Salida</label>
                    <input type="time" id="asistencia-hora" required 
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-700 border border-slate-600 text-white text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                
                <!-- Botones de Acción -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button type="button" id="btn-entrada" class="bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-indigo-900/30 flex items-center justify-center gap-1">
                        ▶️ Marcar Entrada
                    </button>
                    <button type="button" id="btn-salida" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-1">
                        ⏹️ Marcar Salida
                    </button>
                </div>
            </form>
        </div>

        <!-- Enlace al Admin -->
        <div class="text-center">
            <a href="admin.html" class="text-xs text-slate-500 hover:text-slate-300 transition-all">
                ⚙️ Acceso Administrador
            </a>
        </div>

    </div>

</body>
</html>
