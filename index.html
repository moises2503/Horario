<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Registro de Horas | Hub Tech Chiapas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Face API JS para Reconocimiento Facial -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- Scripts locales -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-md w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-indigo-400">HUB TECH CHIAPAS</h1>
            <p class="text-slate-400 text-sm">Control de Asistencia Facial</p>
        </div>

        <!-- Tarjeta Principal de Registro -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
            
            <!-- Hora Actual Fija (No Editable) -->
            <div class="text-center bg-slate-900/80 p-4 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 uppercase tracking-widest block mb-1 font-semibold">Hora Oficial</span>
                <div id="reloj-digital" class="text-4xl font-mono font-bold text-emerald-400 tracking-widest">00:00:00</div>
            </div>

            <!-- Formulario de Matrícula -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-2 font-medium text-center">Ingresa tu Matrícula</label>
                    <input type="text" id="asistencia-matricula" required placeholder="Ej. 2023001" 
                           class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 text-white font-mono text-center text-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                </div>

                <!-- Botones Iniciales de Acción -->
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button type="button" id="btn-iniciar-entrada" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white py-4 rounded-xl font-bold transition-all shadow-lg shadow-indigo-900/30 flex flex-col items-center justify-center gap-1">
                        <span class="text-2xl">▶️</span>
                        <span>ENTRADA</span>
                    </button>
                    <button type="button" id="btn-iniciar-salida" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-4 rounded-xl font-bold transition-all shadow-lg shadow-emerald-900/30 flex flex-col items-center justify-center gap-1">
                        <span class="text-2xl">⏹️</span>
                        <span>SALIDA</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Enlace al Admin -->
        <div class="text-center">
            <a href="admin.html" class="text-xs text-slate-500 hover:text-slate-300 transition-all">
                ⚙️ Acceso Administrador
            </a>
        </div>

    </div>

    <!-- MODAL ESCÁNER CIRCULAR (ESTILO ELEKTRA) -->
    <div id="modal-escaner" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 hidden">
        
        <div class="text-center space-y-2 mb-6">
            <h3 id="modal-titulo" class="text-xl font-bold text-white uppercase tracking-wider">Verificando Identidad</h3>
            <p id="modal-subtitulo" class="text-sm text-slate-400">Alinea tu rostro dentro del círculo</p>
        </div>

        <!-- Círculo de la Cámara -->
        <div class="relative w-64 h-64 rounded-full border-4 border-indigo-500 shadow-[0_0_30px_rgba(99,102,241,0.4)] overflow-hidden flex items-center justify-center bg-slate-900">
            
            <video id="camara-preview" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
            <canvas id="foto-canvas" class="hidden"></canvas>

            <!-- Capa sobrepuesta para palomita / error -->
            <div id="overlay-status" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/85 backdrop-blur-sm transition-all duration-300 hidden">
                <div id="status-icon" class="text-6xl mb-2"></div>
                <p id="status-message" class="text-sm font-semibold text-center px-4 text-white"></p>
            </div>
        </div>

        <!-- Botón para cancelar -->
        <button type="button" id="btn-cancelar-escaner" class="mt-8 px-6 py-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium border border-slate-700 transition-all">
            ✖️ Cancelar
        </button>
    </div>

</body>
</html>
