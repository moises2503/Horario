<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Horarios</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>
    <script src="js/login.js" defer></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <main class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-6 md:p-8 space-y-6">

        <!-- TÍTULO -->
        <header class="text-center space-y-2">

            <h1 class="text-3xl font-black text-slate-900">
                CONTROL DE HORARIOS
            </h1>

            <p class="text-sm text-slate-500">
                Selecciona cómo deseas ingresar
            </p>

        </header>


        <!-- MENSAJES -->
        <div
            id="auth-message"
            class="hidden rounded-xl p-3 text-sm">
        </div>


        <!-- ========================= -->
        <!-- SELECCIÓN PRINCIPAL -->
        <!-- ========================= -->

        <section
            id="panel-selector"
            class="space-y-4">

            <button
                id="btn-ir-admin"
                type="button"
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 rounded-2xl shadow-lg transition">

                👤 Administrador

            </button>


            <button
                id="btn-ir-control"
                type="button"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg transition">

                🕒 Control de horario

            </button>


            <p class="text-xs text-slate-400 text-center">

                El administrador gestiona la organización.
                El control de horario únicamente registra entradas y salidas.

            </p>

        </section>


        <!-- ========================= -->
        <!-- LOGIN ADMINISTRADOR -->
        <!-- ========================= -->

        <section
            id="panel-login"
            class="hidden space-y-4">

            <div class="flex items-center justify-between">

                <h2 class="text-xl font-bold text-slate-900">
                    Administrador
                </h2>

                <button
                    type="button"
                    data-volver
                    class="text-sm font-bold text-slate-500">

                    ← Volver

                </button>

            </div>


            <form
                id="form-login"
                class="space-y-3">

                <input
                    id="login-email"
                    type="email"
                    required
                    placeholder="Correo electrónico"
                    class="w-full border rounded-xl px-4 py-3">


                <input
                    id="login-password"
                    type="password"
                    required
                    placeholder="Contraseña"
                    class="w-full border rounded-xl px-4 py-3">


                <button
                    id="btn-login"
                    type="submit"
                    class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">

                    Iniciar sesión

                </button>

            </form>


            <button
                id="btn-mostrar-registro"
                type="button"
                class="w-full text-sky-700 font-bold text-sm">

                Registrar nueva organización

            </button>

        </section>


        <!-- ========================= -->
        <!-- CONTROL DE HORARIO -->
        <!-- ========================= -->

        <section
            id="panel-control"
            class="hidden space-y-4">

            <div class="flex items-center justify-between">

                <h2 class="text-xl font-bold text-slate-900">
                    Control de horario
                </h2>

                <button
                    type="button"
                    data-volver
                    class="text-sm font-bold text-slate-500">

                    ← Volver

                </button>

            </div>


            <p class="text-sm text-slate-500">

                Ingresa el código proporcionado por el administrador de tu organización.

            </p>


            <form
                id="form-control"
                class="space-y-3">

                <input
                    id="control-codigo"
                    type="text"
                    required
                    autocomplete="off"
                    placeholder="Código de organización"
                    class="w-full border rounded-xl px-4 py-3 text-center font-mono text-xl uppercase tracking-widest">


                <button
                    id="btn-control"
                    type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">

                    Ingresar al horario

                </button>

            </form>

        </section>


        <!-- ========================= -->
        <!-- REGISTRO ORGANIZACIÓN -->
        <!-- ========================= -->

        <section
            id="panel-registro"
            class="hidden space-y-4">

            <div class="flex items-center justify-between">

                <h2 class="text-xl font-bold text-slate-900">
                    Registrar organización
                </h2>

                <button
                    id="btn-volver-login"
                    type="button"
                    class="text-sm font-bold text-slate-500">

                    ← Volver

                </button>

            </div>


            <form
                id="form-registro-organizacion"
                class="space-y-3">


                <input
                    id="reg-organizacion"
                    type="text"
                    required
                    placeholder="Nombre de la organización"
                    class="w-full border rounded-xl px-4 py-3">


                <select
                    id="reg-tipo"
                    required
                    class="w-full border rounded-xl px-4 py-3">

                    <option value="Empresa">Empresa</option>

                    <option value="Escuela">Escuela</option>

                    <option value="Hospital">Hospital</option>

                    <option value="Institución">Institución</option>

                    <option value="Negocio">Negocio</option>

                    <option value="Otro">Otro</option>

                </select>


                <input
                    id="reg-admin-nombre"
                    type="text"
                    required
                    placeholder="Nombre del administrador"
                    class="w-full border rounded-xl px-4 py-3">


                <input
                    id="reg-email"
                    type="email"
                    required
                    placeholder="Correo del administrador"
                    class="w-full border rounded-xl px-4 py-3">


                <input
                    id="reg-password"
                    type="password"
                    minlength="8"
                    required
                    placeholder="Contraseña"
                    class="w-full border rounded-xl px-4 py-3">


                <input
                    id="reg-confirm-password"
                    type="password"
                    minlength="8"
                    required
                    placeholder="Confirmar contraseña"
                    class="w-full border rounded-xl px-4 py-3">


                <button
                    id="btn-registro"
                    type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">

                    Registrar organización

                </button>

            </form>

        </section>


    </main>


</body>
</html>
