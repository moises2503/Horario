<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Registro | Hub Tech</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hubDark: '#1E293B',
                        hubBlue: '#00A3E0',
                        hubGreen: '#22C55E',
                        hubYellow: '#EAB308',
                        hubPink: '#E11D48',
                        hubBg: '#F8F9FA'
                    }
                }
            }
        }
    </script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Face API JS para Reconocimiento Facial -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- Scripts locales -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</head>
<body class="bg-hubBg text-slate-800 min-h-screen p-4 md:p-8 flex items-center justify-center font-sans relative overflow-x-hidden">

    <!-- CANVAS ANIMACIÓN DE RED Y NODOS TECH -->
    <canvas id="bg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <div class="max-w-md w-full space-y-6 relative z-10">
        
        <!-- Header con Identidad de Marca HUB TECH -->
        <div class="text-center space-y-2">
            <!-- Mosaico de Cuadros con Colores Oficiales -->
            <div class="flex items-center justify-center gap-1.5 mb-2">
                <span class="w-3.5 h-3.5 rounded-sm bg-hubPink shadow-sm"></span>
                <span class="w-3.5 h-3.5 rounded-sm bg-hubBlue shadow-sm"></span>
                <span class="w-3.5 h-3.5 rounded-sm bg-hubYellow shadow-sm"></span>
                <span class="w-3.5 h-3.5 rounded-sm bg-hubGreen shadow-sm"></span>
            </div>
            
            <h1 class="text-4xl font-black text-hubDark tracking-tight">
                HUB <span class="text-hubDark">TECH</span>
            </h1>
            
            <p class="text-hubBlue text-xs font-bold tracking-widest uppercase">
                Tecnología ▪ Talento ▪ Innovación
            </p>
        </div>

        <!-- Tarjeta Principal de Registro -->
        <div class="bg-white/90 backdrop-blur-md p-6 rounded-3xl border border-slate-200/80 shadow-2xl space-y-6">
            
            <!-- Hora Actual Fija -->
            <div class="text-center bg-slate-50/80 p-4 rounded-2xl border border-slate-100">
                <span class="text-xs text-slate-400 uppercase tracking-widest block mb-1 font-semibold">Hora Servidor</span>
                <div id="reloj-digital" class="text-4xl font-mono font-bold text-hubDark tracking-widest">00:00:00</div>
            </div>

            <!-- Formulario de Matrícula -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-500 mb-2 font-medium text-center uppercase tracking-wider">Ingresa tu Matrícula</label>
                    <input type="text" id="asistencia-matricula" required placeholder="Ej. 2023001" 
                           class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-hubDark font-mono text-center text-xl focus:outline-none focus:ring-2 focus:ring-hubBlue transition-all">
                </div>

                <!-- Botones Iniciales de Acción -->
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button type="button" id="btn-iniciar-entrada" class="bg-hubBlue hover:bg-sky-600 active:scale-95 text-white py-4 rounded-xl font-bold transition-all shadow-lg shadow-sky-500/20 flex flex-col items-center justify-center gap-1">
                        <span class="text-2xl">▶️</span>
                        <span>ENTRADA</span>
                    </button>
                    <button type="button" id="btn-iniciar-salida" class="bg-hubGreen hover:bg-emerald-600 active:scale-95 text-white py-4 rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/20 flex flex-col items-center justify-center gap-1">
                        <span class="text-2xl">⏹️</span>
                        <span>SALIDA</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Enlace al Admin -->
        <div class="text-center">
            <a href="admin.html" class="text-xs text-slate-400 hover:text-hubDark transition-all">
                ⚙️ Acceso Administrador
            </a>
        </div>

    </div>

    <!-- MODAL ESCÁNER CIRCULAR -->
    <div id="modal-escaner" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 hidden">
        
        <div class="text-center space-y-2 mb-6">
            <h3 id="modal-titulo" class="text-xl font-bold text-white uppercase tracking-wider">Verificando Identidad</h3>
            <p id="modal-subtitulo" class="text-sm text-slate-300">Alinea tu rostro dentro del círculo</p>
        </div>

        <!-- Círculo de la Cámara con borde Azul Hub Tech -->
        <div class="relative w-64 h-64 rounded-full border-4 border-hubBlue shadow-[0_0_30px_rgba(0,163,224,0.5)] overflow-hidden flex items-center justify-center bg-slate-950">
            
            <video id="camara-preview" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
            <canvas id="foto-canvas" class="hidden"></canvas>

            <!-- Capa sobrepuesta para palomita / error -->
            <div id="overlay-status" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-sm transition-all duration-300 hidden">
                <div id="status-icon" class="text-6xl mb-2"></div>
                <p id="status-message" class="text-sm font-semibold text-center px-4 text-white"></p>
            </div>
        </div>

        <!-- Botón para cancelar -->
        <button type="button" id="btn-cancelar-escaner" class="mt-8 px-6 py-2.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium border border-slate-700 transition-all">
            ✖️ Cancelar
        </button>
    </div>

    <!-- SCRIPT DE ANIMACIÓN TIPO HUB TECH -->
    <script>
        (function() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];

            const colors = ['#00A3E0', '#22C55E', '#EAB308', '#E11D48'];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.7;
                    this.vy = (Math.random() - 0.5) * 0.7;
                    this.radius = Math.random() * 2 + 1.5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = 0.5;
                    ctx.fill();
                }
            }

            function init() {
                resize();
                particles = [];
                const particleCount = Math.floor((width * height) / 18000);
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                // Conexiones en red estilo tech
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = '#00A3E0';
                            ctx.globalAlpha = (1 - dist / 110) * 0.15;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', init);
            init();
            animate();
        })();
    </script>
</body>
</html>
