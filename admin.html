<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador | Hub Tech Chiapas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Scripts locales -->
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b border-slate-800 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">Panel de Administración</h1>
                <p class="text-slate-400 text-xs">Gestión de Instituciones, Alumnos y Control de Asistencia</p>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg transition-all border border-slate-700">
                ← Volver al Registro de Salidas
            </a>
        </div>

        <!-- Grid de Formularios -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- 1. Registrar Entrada (Admin) -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-3">
                <h2 class="text-md font-semibold text-indigo-300 border-b border-slate-700 pb-2">
                    ⏱️ Registrar Entrada
                </h2>
                <form id="form-entrada" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Alumno</label>
                        <select id="entrada-alumno" required class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="">Selecciona un alumno</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Fecha</label>
                        <input type="date" id="entrada-fecha" required class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Hora de Entrada</label>
                        <input type="time" id="entrada-hora" required class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-sm font-semibold transition-all">
                        Asignar Hora de Entrada
                    </button>
                </form>
            </div>

            <!-- 2. Registrar Alumno -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-3">
                <h2 class="text-md font-semibold text-emerald-300 border-b border-slate-700 pb-2">
                    👤 Nuevo Alumno
                </h2>
                <form id="form-alumno" class="space-y-3">
                    <div>
                        <input type="text" id="alum-matricula" required placeholder="Matrícula" class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <div>
                        <input type="text" id="alum-nombre" required placeholder="Nombre Completo" class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <!-- Campo de Foto Oficial de Perfil -->
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Foto Oficial (Rostro claro)</label>
                        <input type="file" id="alum-foto" accept="image/*" required class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="alum-tipo" required class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
                            <option value="Servicio Social">Servicio Social</option>
                            <option value="Residencia">Residencia / Estadía</option>
                        </select>
                        <select id="alum-institucion" required class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
                            <option value="">Institución</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400">Inicio</label>
                            <input type="date" id="alum-fecha-inicio" required class="w-full px-2 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400">Hrs Obj.</label>
                            <input type="number" id="alum-horas-obj" value="480" required class="w-full px-2 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400">Hrs Prev.</label>
                            <input type="number" id="alum-horas-previas" value="0" class="w-full px-2 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-xs text-white">
                        </div>
                    </div>
                    <button type="submit" id="btn-guardar-alumno" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-sm font-semibold transition-all">
                        Guardar Alumno
                    </button>
                </form>
            </div>

            <!-- 3. Registrar Institución -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-3">
                <h2 class="text-md font-semibold text-amber-300 border-b border-slate-700 pb-2">
                    🏛️ Nueva Institución
                </h2>
                <form id="form-institucion" class="space-y-3">
                    <div>
                        <input type="text" id="inst-nombre" required placeholder="Nombre de la Escuela/Inst." class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                    </div>
                    <div>
                        <input type="text" id="inst-carrera" placeholder="Carrera / Especialidad" class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                    </div>
                    <div>
                        <input type="text" id="inst-responsable" placeholder="Responsable o Encargado" class="w-full px-3 py-2 rounded-lg bg-slate-700 border border-slate-600 text-sm text-white focus:outline-none focus:ring-1 focus:ring-amber-500">
                    </div>
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-lg text-sm font-semibold transition-all">
                        Guardar Institución
                    </button>
                </form>
            </div>

        </div>

        <!-- Tabla de Alumnos -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden">
            <div class="p-4 border-b border-slate-700">
                <h2 class="text-md font-semibold text-white">📋 Lista de Alumnos Registrados</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/50 text-slate-400 uppercase text-[11px] font-semibold border-b border-slate-700">
                        <tr>
                            <th class="p-3">Foto</th>
                            <th class="p-3">Alumno</th>
                            <th class="p-3">Tipo</th>
                            <th class="p-3">Fecha Inicio</th>
                            <th class="p-3">Avance</th>
                            <th class="p-3">Horas</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos" class="divide-y divide-slate-700/50">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
