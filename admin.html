<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador | Hub Tech Chiapas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hubDark: '#1E293B',
                        hubBlue: '#00A3E0',
                        hubGreen: '#22C55E',
                        hubYellow: '#EAB308',
                        hubPink: '#E11D48',
                        hubBg: '#0F172A'
                    }
                }
            }
        }
    </script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Scripts locales -->
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</head>
<body class="bg-hubBg text-slate-100 min-h-screen p-4 md:p-8 font-sans relative overflow-x-hidden">

    <!-- CANVAS ANIMACIÓN DE RED Y NODOS TECH -->
    <canvas id="bg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <div class="max-w-6xl mx-auto space-y-8 relative z-10">
        
        <!-- Header con Identidad Hub Tech -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b border-slate-800/80 pb-5 gap-4 backdrop-blur-sm bg-slate-900/40 p-4 rounded-2xl border border-slate-800/50">
            <div class="flex items-center gap-4">
                <!-- Mosaico de Cuadros Oficiales -->
                <div class="grid grid-cols-2 gap-1">
                    <span class="w-3 h-3 rounded-sm bg-hubPink"></span>
                    <span class="w-3 h-3 rounded-sm bg-hubBlue"></span>
                    <span class="w-3 h-3 rounded-sm bg-hubYellow"></span>
                    <span class="w-3 h-3 rounded-sm bg-hubGreen"></span>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white tracking-tight flex items-center gap-2">
                        HUB <span class="text-hubBlue">TECH</span>
                        <span class="text-xs bg-hubBlue/20 text-hubBlue border border-hubBlue/30 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Admin</span>
                    </h1>
                    <p class="text-slate-400 text-xs">Gestión de Instituciones, Alumnos y Control de Asistencia</p>
                </div>
            </div>
            
            <a href="index.html" class="text-xs bg-slate-800/90 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl transition-all border border-slate-700/80 flex items-center gap-2 font-medium shadow-lg hover:border-hubBlue/50">
                <span>←</span> Volver al Registro de Entrada/Salida
            </a>
        </div>

        <!-- Grid de Formularios -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- 1. Registrar Entrada (Admin) -->
            <div class="bg-slate-800/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700/80 shadow-xl space-y-4 hover:border-hubBlue/40 transition-all">
                <h2 class="text-md font-bold text-hubBlue border-b border-slate-700/80 pb-2.5 flex items-center gap-2">
                    <span>⏱️</span> Registrar Entrada
                </h2>
                <form id="form-entrada" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1 font-medium">Alumno</label>
                        <select id="entrada-alumno" required class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubBlue transition-all">
                            <option value="">Selecciona un alumno</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1 font-medium">Fecha</label>
                        <input type="date" id="entrada-fecha" required class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubBlue transition-all">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1 font-medium">Hora de Entrada</label>
                        <input type="time" id="entrada-hora" required class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubBlue transition-all">
                    </div>
                    <button type="submit" class="w-full bg-hubBlue hover:bg-sky-500 active:scale-95 text-white py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-sky-500/20">
                        Asignar Hora de Entrada
                    </button>
                </form>
            </div>

            <!-- 2. Registrar Alumno -->
            <div class="bg-slate-800/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700/80 shadow-xl space-y-4 hover:border-hubGreen/40 transition-all">
                <h2 class="text-md font-bold text-hubGreen border-b border-slate-700/80 pb-2.5 flex items-center gap-2">
                    <span>👤</span> Nuevo Alumno
                </h2>
                <form id="form-alumno" class="space-y-3">
                    <div>
                        <input type="text" id="alum-matricula" required placeholder="Matrícula" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubGreen transition-all">
                    </div>
                    <div>
                        <input type="text" id="alum-nombre" required placeholder="Nombre Completo" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubGreen transition-all">
                    </div>
                    <!-- Campo de Foto Oficial de Perfil -->
                    <div>
                        <label class="block text-xs text-slate-300 mb-1 font-medium">Foto Oficial (Rostro claro)</label>
                        <input type="file" id="alum-foto" accept="image/*" required class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-hubGreen file:text-white hover:file:bg-emerald-600 cursor-pointer">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="alum-tipo" required class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubGreen transition-all">
                            <option value="Servicio Social">Servicio Social</option>
                            <option value="Residencia">Residencia / Estadía</option>
                        </select>
                        <select id="alum-institucion" required class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubGreen transition-all">
                            <option value="">Institución</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400 font-medium">Inicio</label>
                            <input type="date" id="alum-fecha-inicio" required class="w-full px-2 py-1.5 rounded-xl bg-slate-900/80 border border-slate-700 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 font-medium">Hrs Obj.</label>
                            <input type="number" id="alum-horas-obj" value="480" required class="w-full px-2 py-1.5 rounded-xl bg-slate-900/80 border border-slate-700 text-xs text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 font-medium">Hrs Prev.</label>
                            <input type="number" id="alum-horas-previas" value="0" class="w-full px-2 py-1.5 rounded-xl bg-slate-900/80 border border-slate-700 text-xs text-white">
                        </div>
                    </div>
                    <button type="submit" id="btn-guardar-alumno" class="w-full bg-hubGreen hover:bg-emerald-600 active:scale-95 text-white py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-emerald-500/20">
                        Guardar Alumno
                    </button>
                </form>
            </div>

            <!-- 3. Registrar Institución -->
            <div class="bg-slate-800/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700/80 shadow-xl space-y-4 hover:border-hubYellow/40 transition-all">
                <h2 class="text-md font-bold text-hubYellow border-b border-slate-700/80 pb-2.5 flex items-center gap-2">
                    <span>🏛️</span> Nueva Institución
                </h2>
                <form id="form-institucion" class="space-y-3">
                    <div>
                        <input type="text" id="inst-nombre" required placeholder="Nombre de la Escuela/Inst." class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubYellow transition-all">
                    </div>
                    <div>
                        <input type="text" id="inst-carrera" placeholder="Carrera / Especialidad" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubYellow transition-all">
                    </div>
                    <div>
                        <input type="text" id="inst-responsable" placeholder="Responsable o Encargado" class="w-full px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:outline-none focus:ring-2 focus:ring-hubYellow transition-all">
                    </div>
                    <button type="submit" class="w-full bg-hubYellow hover:bg-yellow-600 active:scale-95 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-yellow-500/20">
                        Guardar Institución
                    </button>
                </form>
            </div>

        </div>

        <!-- Tabla de Alumnos -->
        <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/80 shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-700/80 flex justify-between items-center bg-slate-900/40">
                <h2 class="text-md font-bold text-white flex items-center gap-2">
                    <span>📋</span> Lista de Alumnos Registrados
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-slate-400 uppercase text-[11px] font-bold border-b border-slate-700/80 tracking-wider">
                        <tr>
                            <th class="p-3.5">Foto</th>
                            <th class="p-3.5">Alumno</th>
                            <th class="p-3.5">Tipo</th>
                            <th class="p-3.5">Fecha Inicio</th>
                            <th class="p-3.5">Avance</th>
                            <th class="p-3.5">Horas</th>
                            <th class="p-3.5 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos" class="divide-y divide-slate-700/50">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE ANIMACIÓN TIPO HUB TECH -->
    <script>
        (function() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];

            // Colores corporativos Hub Tech
            const colors = ['#00A3E0', '#22C55E', '#EAB308', '#E11D48'];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = (Math.random() - 0.5) * 0.6;
                    this.radius = Math.random() * 2 + 1.5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = 0.5;
                    ctx.fill();
                }
            }

            function init() {
                resize();
                particles = [];
                const particleCount = Math.floor((width * height) / 18000);
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                // Dibujar conexiones estilo red tech
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = '#00A3E0';
                            ctx.globalAlpha = (1 - dist / 110) * 0.15;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', init);
            init();
            animate();
        })();
    </script>
</body>
</html>
